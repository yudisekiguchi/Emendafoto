# Roda os testes automáticos do Emenda a cada pull request e a cada atualização do main.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: npx playwright test
      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dos-testes
          path: playwright-report/
          retention-days: 14
