<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Emenda">
<title>Emenda</title>
<!-- Fontes do Google: opcionais. Sem internet, o app usa as fontes do sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=Bebas+Neue&family=Space+Grotesk:wght@400;700&family=Syne:wght@400;700;800&family=Caveat:wght@400;700&family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@300;400;700&display=swap">
<style>
:root{--bg:#0e0e10;--stage:#0a0a0c;--panel:#141418;--card:#1c1c22;--card2:#26262e;--line:#2a2a33;--text:#ededf2;--muted:#9696a3;--accent:#8b6cff;--accent-d:#7352f5;--danger:#ff7676}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-right:4px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#ff8fb1);display:inline-block;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.icon{width:36px;padding:0}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-d)}
.btn:disabled{opacity:.35;cursor:default}
.btn.wide{width:100%}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card);height:36px}
.stepper button{border:0;background:none;width:32px;height:100%;display:flex;align-items:center;justify-content:center}
.stepper span{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
select{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 8px;font:inherit}
.sp{flex:1}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.saved.err{display:inline!important;color:var(--danger);font-weight:600}
.vers{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.vers div{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px}
.vers div+div{border-top:1px solid var(--line)}
.vers span{flex:1;min-width:0}
.vers small{color:var(--muted);display:block}
.vers .btn{height:30px;font-size:12px}
main{flex:1;display:flex;min-height:0}
#tools{width:78px;flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:11px}
.tool .ico{width:22px;height:22px}
.tool:hover{color:var(--text);background:var(--card)}
.tool.on{color:#fff;background:var(--card2)}
#stage{flex:1;position:relative;min-width:0;min-height:0;background:var(--stage);overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.ov{position:absolute;display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:rgba(20,20,24,.88);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ov button{border:0;background:none;height:32px;min-width:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-size:12.5px}
.ov button:hover{background:var(--card2)}
#pager{left:50%;transform:translateX(-50%);bottom:12px}
.ov button.on{background:var(--accent);color:#fff}
#pager button span{min-width:0;color:inherit}
#pager span{font-size:12.5px;color:var(--muted);min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
#zoom{right:12px;bottom:12px}
#zoom span{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#hint{left:50%;top:12px;transform:translateX(-50%);font-size:12.5px;padding:8px 12px;pointer-events:none;display:none;text-align:center;max-width:calc(100% - 24px)}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;width:min(360px,calc(100% - 32px))}
#empty .card{pointer-events:auto;background:rgba(20,20,24,.92);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#empty h2{margin:0 0 6px;font-size:16px}
#empty p{margin:0 0 14px;color:var(--muted);font-size:13px}
#empty .b2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#drop{position:absolute;inset:0;border:2px dashed var(--accent);background:rgba(139,108,255,.08);display:none;align-items:center;justify-content:center;font-weight:600;pointer-events:none}
#panel{width:320px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ph h3{margin:0;font-size:15px}
.ph .x{display:none}
.sec{margin:18px 0 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-height:36px}
.row>label{flex:0 0 92px;font-size:12.5px;color:var(--muted)}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row .val{flex:0 0 46px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row select{flex:1;min-width:0}
input[type=color]{width:46px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px;flex:none}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:11px;color:var(--text);min-width:0}
.act:hover{background:var(--card2)}
.act.on{border-color:var(--accent);background:#2a2340}
.act.danger{color:var(--danger)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bgrid .btn{font-size:12.5px;height:38px;padding:0 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:var(--card);height:32px;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
textarea{width:100%;min-height:76px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;font:inherit;resize:vertical}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;text-align:left}
.tpl:hover{background:var(--card2)}
.tpl.on{border-color:var(--accent)}
.tpl canvas{display:block;width:100%;height:46px;border-radius:3px;margin-bottom:6px;background:#0a0a0c}
.tpl b{font-size:12px;font-weight:600;display:block}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emo button{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:22px;padding:0}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.18);padding:0}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.pre{flex:none;border:0;background:none;padding:0;text-align:center;font-size:11px;color:var(--muted)}
.pre canvas{display:block;width:58px;height:58px;border-radius:9px;border:2px solid transparent;margin-bottom:4px;background:#222}
.pre.on canvas{border-color:var(--accent)}
.pre.on{color:#fff}
button.cbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}
button.cbtn:hover{background:var(--card2)}
.cbtn i{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.28);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#cpop{position:fixed;z-index:45;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;box-shadow:0 14px 44px rgba(0,0,0,.55);display:none;max-height:calc(100dvh - 20px);overflow-y:auto}
#cpop.show{display:block}
#cpop .wheel{position:relative;width:220px;height:220px;margin:4px auto 12px;touch-action:none;cursor:crosshair}
#cpop .wheel canvas{width:100%;height:100%;display:block;border-radius:50%}
#cpop .mk{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none}
#cpV{width:100%;-webkit-appearance:none;appearance:none;height:16px;border-radius:999px;outline:none;margin:0;border:1px solid rgba(255,255,255,.15)}
#cpV::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35);box-shadow:0 1px 4px rgba(0,0,0,.45)}
#cpV::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35)}
.crow{display:flex;gap:8px;align-items:center;margin-top:12px}
.cprev{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.28);flex:none}
.chex{flex:1;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}
.clab{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.cdots{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.cdots button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.22);padding:0}
body.lay-bottom #cpop{left:8px!important;right:8px;top:auto!important;bottom:calc(66px + env(safe-area-inset-bottom));width:auto;max-width:420px}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.lib button{aspect-ratio:1;border:1px solid var(--line);background:#ece9e3;border-radius:10px;padding:5px;position:relative;overflow:hidden}
.lib img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.lib.edit button{outline:2px solid var(--danger);outline-offset:-2px}
.lib.edit button::after{content:'×';position:absolute;top:0;right:5px;color:var(--danger);font-weight:800;font-size:16px}
input.search{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 10px;font:inherit;margin-top:8px}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.note kbd{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font:11px ui-monospace,monospace;color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;min-height:34px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;min-width:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:#25252d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
#modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(540px,100%);max-height:94dvh;overflow:auto;padding:16px 18px 20px}
.phone{width:min(390px,100%);margin:0 auto;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.phone .top{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600}
.phone .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ff8fb1)}
.pvwrap{position:relative}
.pv{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#111}
.pv::-webkit-scrollbar{display:none}
.pv img,.pv canvas{flex:none;width:100%;scroll-snap-align:center;display:block}
.pvcount{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
.dots{display:flex;justify-content:center;gap:4px;padding:10px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:#555}
.dots i.on{background:var(--accent)}
.strip{display:flex;gap:2px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.strip img,.strip canvas{height:90px;width:auto;display:block}
.prog{font-size:12.5px;color:var(--muted);min-height:18px;margin-top:10px}
@media (max-width:820px){
  .brand span,.hide-m,.saved{display:none}
  header{gap:6px;padding:8px}
  .btn,.stepper,select{height:34px}
  .btn.icon{width:34px}
  .stepper span{min-width:30px}
  .stepper span small{display:none}
  input,select,textarea{font-size:16px}
  #zoom{display:none}
}
/* posição das ferramentas (Projeto → Posição das ferramentas) */
body.lay-right main{flex-direction:row-reverse}
body.lay-right #tools{border-right:0;border-left:1px solid var(--line)}
body.lay-right #panel{border-left:0;border-right:1px solid var(--line)}
body.lay-bottom main{flex-direction:column}
body.lay-bottom #stage{order:1;flex:1}
body.lay-bottom #panel{order:2;width:auto;max-height:46vh;border-left:0;border-top:1px solid var(--line);padding:12px 14px 16px}
body.lay-bottom #panel.hidden{display:none}
body.lay-bottom #tools{order:3;width:auto;flex-direction:row;justify-content:center;gap:4px;padding:4px;padding-bottom:max(4px,env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
body.lay-bottom .tool{padding:6px 4px;min-width:50px;flex:0 1 84px}
body.lay-bottom .ph .x{display:inline-flex}
body.lay-bottom #pager{bottom:8px}
body.lay-bottom .tpls{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (min-width:821px){body.lay-bottom #panel{max-height:40vh}}
/* embaixo em tela larga: o painel se distribui em colunas e usa a largura toda */
@media (min-width:700px){
  body.lay-bottom .pc{columns:300px;column-gap:28px}
  body.lay-bottom .pc>*{break-inside:avoid}
  body.lay-bottom .pc>.sec{break-after:avoid;margin-top:12px}
  body.lay-bottom .pc>.ph,body.lay-bottom .pc>.tpls{column-span:all}
  body.lay-bottom .pc>.ph{margin-bottom:8px}
  body.lay-bottom .pc>.acts{margin-bottom:6px}
}
</style>
</head>
<body>
<header id="top"></header>
<main>
  <nav id="tools"></nav>
  <section id="stage">
    <canvas id="cv" tabindex="0"></canvas>
    <div id="hint" class="ov"></div>
    <div id="empty"><div class="card">
      <h2>Comece seu carrossel</h2>
      <p>Escolha um layout e toque nas molduras, ou adicione fotos e vídeos curtos direto. Você também pode arrastar arquivos para cá.</p>
      <div class="b2"><button class="btn" data-tool="layouts">Escolher layout</button><button class="btn primary" data-tool="photos">Adicionar fotos/vídeos</button></div>
      <p style="margin:12px 0 0"><button class="btn" data-act="slice" style="width:100%">Fatiar uma imagem pronta</button></p>
    </div></div>
    <div id="pager" class="ov"></div>
    <div id="zoom" class="ov"></div>
    <div id="drop">Solte fotos ou vídeos aqui</div>
  </section>
  <aside id="panel"></aside>
</main>
<input type="file" id="fileIn" accept="image/*,video/*" multiple hidden>
<input type="file" id="fileOne" accept="image/*,video/*" hidden>
<input type="file" id="projIn" accept=".json,application/json" hidden>
<input type="file" id="fontIn" accept=".ttf,.otf,.woff,.woff2" hidden>
<input type="file" id="libIn" accept="image/*,.svg" multiple hidden>
<input type="file" id="libDir" webkitdirectory multiple hidden>
<input type="file" id="bgIn" accept="image/*" hidden>
<input type="file" id="sliceIn" accept="image/*" hidden>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<div id="cpop" role="dialog" aria-label="Escolher cor"></div>
<script>
'use strict';
/* =========================================================
   Emenda — editor local de carrosséis contínuos
   Tudo roda no navegador. Nenhuma foto sai do seu computador.
   ========================================================= */
const $ = s => document.querySelector(s);
const W = 1080;
const RATIOS = { '1:1': 1080, '4:5': 1350, '3:4': 1440, '9:16': 1920 };
const RATIO_LABEL = { '1:1': '1:1 Quadrado', '4:5': '4:5 Retrato', '3:4': '3:4 Alto', '9:16': '9:16 Story' };
const MAX_SLIDES = 20;
const MAX_VIDEO_S = 60;   // Instagram aceita até 60 s por slide: é o tamanho máximo do trecho
const MAX_SOURCE_S = 600; // vídeo original pode ter até 10 min; escolhe-se o trecho no painel
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rad = d => d * Math.PI / 180;
const uid = () => Math.random().toString(36).slice(2, 10);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const isSmall = () => matchMedia('(max-width: 820px)').matches;
const LAY_KEY = 'emenda-layout', LAYOUTS = [['auto', 'Automático'], ['left', 'Esquerda'], ['right', 'Direita'], ['bottom', 'Embaixo']];
function layPref() { try { return localStorage.getItem(LAY_KEY) || 'auto'; } catch (_) { return 'auto'; } }
function applyLayout() { // automático: embaixo em telas estreitas, à esquerda nas largas
  const p = layPref(), mode = p === 'auto' ? (isSmall() ? 'bottom' : 'left') : p;
  document.body.classList.toggle('lay-bottom', mode === 'bottom'); document.body.classList.toggle('lay-right', mode === 'right');
}
applyLayout();
const isMobile = () => document.body.classList.contains('lay-bottom'); // ferramentas embaixo: painel abre e fecha

const FONTS = ['Inter', 'Montserrat', 'Playfair Display', 'DM Serif Display', 'Instrument Serif', 'Bebas Neue', 'Space Grotesk', 'Syne', 'Caveat', 'Archivo Black', 'Cormorant Garamond', 'Josefin Sans', 'Arial', 'Helvetica', 'Georgia', 'Times New Roman', 'Courier New', 'system-ui'];

/* ---------- ícones ---------- */
const IC = {
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

    for (const id of usedImageIds()) if (!SAVED_MEDIA.has(id)) { await IDB.set('media:' + id, IMGS.get(id).blob); SAVED_MEDIA.add(id); }
    const t = Date.now();
    await IDB.set('project', { v: 2, state: S, fonts: S.customFonts.filter(f => FONTBUF.has(f.id)).map(f => [f.id, FONTBUF.get(f.id)]), t });
    if (S.els.length && (!VERS[0] || t - VERS[0].t >= VERSION_EVERY)) await pushVersion('');
    if (saveFails) toast('Salvamento voltou a funcionar ✓');
    saveFails = 0; setSaved('Salvo neste aparelho');
  } catch (err) {
    console.warn(err); saveFails++; setSaved('⚠ Não salvou', true);
    if (saveFails === 1) warnSaveFailed(err);
  }
}
function warnSaveFailed(err) {
  const full = err && /quota/i.test((err.name || '') + (err.message || ''));
  openModal(`<div class="ph"><h3>⚠ O trabalho não está sendo salvo</h3><button class="btn icon" data-act="closeModal">${I('x')}</button></div>
  <p class="note" style="font-size:13.5px;color:var(--text)">${full ? 'O espaço que o navegador reserva para o app acabou.' : 'O navegador recusou o salvamento automático.'} Até isso se resolver, as próximas alterações podem se perder se o app fechar.</p>
  <p class="note">Salve agora um arquivo do projeto (.json) no aparelho. ${full ? 'Para liberar espaço, apague vídeos que não estão sendo usados ou comece um projeto novo depois de salvar o .json.' : ''}</p>
  <div class="bgrid" style="margin-top:12px"><button class="btn primary" data-act="saveProject">${I('download')} Salvar .json agora</button><button class="btn" data-act="retrySave">Tentar de novo</button></div>`);
}
function setSaved(t, err) { const s = $('#saved'); if (s) { s.textContent = t; s.classList.toggle('err', !!err); } }

  if (!S.els.length) return;
  VERS.unshift({ t: Date.now(), label, state: cloneState(S) }); VERS = VERS.slice(0, 30);

// apaga do aparelho fotos/vídeos que nenhum projeto nem versão usa mais
async function collectMedia() {
  try {
    const used = new Set(), add = st => (st.els || []).forEach(e => { if (e.type === 'image' && e.img) used.add(e.img.id); });
    add(S); VERS.forEach(v => add(v.state));
    for (const k of await IDB.keys()) if (typeof k === 'string' && k.startsWith('media:') && !used.has(k.slice(6))) { await IDB.del(k); SAVED_MEDIA.delete(k.slice(6)); }
  } catch (err) { console.warn(err); }
}
async function restoreProject(p) {
  for (const [id, buf] of (p.fonts || [])) { const f = (p.state.customFonts || []).find(x => x.id === id); if (f) await registerFont(f.family, buf, id).catch(() => { }); }
  for (const [id, blob] of (p.images || [])) { try { await addImageBlob(blob, id); } catch (_) { } } // formato antigo e arquivo .json
  for (const e of (p.state.els || [])) { // formato novo: cada foto/vídeo guardado separado
    if (e.type !== 'image' || !e.img || IMGS.has(e.img.id)) continue;
    try { const b = await IDB.get('media:' + e.img.id); if (b) { await addImageBlob(b, e.img.id); SAVED_MEDIA.add(e.img.id); } } catch (_) { }
  }

}

}

/* clique em qualquer [data-act] / [data-tool] */
document.addEventListener('click', e => {
  const cb = e.target.closest('.cbtn'); if (cb) { openColor(cb); return; }
  const a = e.target.closest('[data-act]');
  if (a) { const fn = ACT[a.dataset.act]; if (fn) fn(a.dataset.arg); return; }
  const t = e.target.closest('[data-tool]');

  const mime = mode === 'strip' ? null : pickVideoMime(), vidIdx = mime ? idx.filter(slideHasVideo) : [];
  // o AudioContext é criado ainda dentro do clique, senão o navegador pode bloquear o som
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = vidIdx.length && AC && vidIdx.some(i => slideVideoEls(i).some(e => !e.mute)) ? new AC() : null;
  if (ac && ac.state === 'suspended') ac.resume().catch(() => { });
  document.querySelectorAll('#mbox .btn').forEach(b => b.disabled = true);
  try {
    await waitFonts(); await settleStills(); const files = [];
    for (const i of (mode === 'strip' ? [] : idx)) {
      const nm = `carrossel_${String(i + 1).padStart(2, '0')}`;
      if (vidIdx.includes(i)) {
        const vext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        const b = await recordSlide(i, Math.min(ex.size, 1080), mime, ac, k => { if (prog) prog.textContent = `Gravando vídeo do slide ${i + 1}… ${Math.round(k * 100)}%`; });
        files.push({ name: `${nm}.${vext}`, blob: b }); continue;
      }
      if (prog) prog.textContent = `Renderizando slide ${i + 1}…`; await new Promise(r => setTimeout(r, 16));
      const b = await toBlob(renderSlide(i, ex.size), type, ex.q); files.push({ name: `${nm}.${ext}`, blob: b });
    }
    if (mode === 'strip') {
      if (prog) prog.textContent = 'Renderizando a faixa inteira…'; await new Promise(r => setTimeout(r, 16));
      const outW = Math.min(S.slides * ex.size, 16000), b = await toBlob(renderRegion(0, TW(), outW), type, ex.q);
      download(b, `carrossel_faixa.${ext}`); if (prog) prog.textContent = `Pronto: faixa de ${outW} px.`;
      document.querySelectorAll('#mbox .btn').forEach(b2 => b2.disabled = false); return;
    }
    if (mode === 'zip') {
      if (prog) prog.textContent = 'Montando ZIP…';
      const zf = []; for (const f of files) zf.push({ name: f.name, data: new Uint8Array(await f.blob.arrayBuffer()) });
      download(makeZip(zf), 'carrossel.zip');
    } else if (mode === 'each') {
      for (const f of files) { download(f.blob, f.name); await new Promise(r => setTimeout(r, 400)); }
    } else {
      const fl = files.map(f => new File([f.blob], f.name, { type: f.blob.type || type }));
      if (navigator.canShare && navigator.canShare({ files: fl })) await navigator.share({ files: fl }); else { toast('Este navegador não permite compartilhar arquivos. Use “Baixar”.'); }
    }
    if (prog) prog.textContent = vidIdx.length ? `Pronto: ${files.length - vidIdx.length} imagem(ns) e ${vidIdx.length} vídeo(s).` : `Pronto: ${files.length} imagem(ns).`;
  } catch (err) { console.warn(err); if (prog) prog.textContent = err && err.name === 'AbortError' ? 'Compartilhamento cancelado.' : 'Algo deu errado na exportação.'; }
  if (ac) ac.close().catch(() => { });
  document.querySelectorAll('#mbox .btn').forEach(b => b.disabled = false);
}

/* ---------- UI estática ---------- */
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
function buildStatic() {
  $('#top').innerHTML = `<div class="brand"><i></i><span>Emenda</span></div>
  <div class="stepper" title="Quantidade de slides"><button data-act="slidesMinus" aria-label="Menos slides">${I('minus')}</button><span id="nSlides"></span><button data-act="slidesPlus" aria-label="Mais slides">${I('plus')}</button></div>
  <select id="ratio" title="Proporção">${Object.keys(RATIOS).map(r => `<option value="${r}">${r}</option>`).join('')}</select>
  <span class="saved" id="saved"></span><span class="sp"></span>
  <button class="btn icon" id="bUndo" data-act="undo" title="Desfazer (Ctrl+Z)">${I('undo')}</button>
  <button class="btn icon" id="bRedo" data-act="redo" title="Refazer">${I('redo')}</button>
  <button class="btn" data-act="preview" title="Pré-visualizar">${I('eye')}<span class="hide-m">Prévia</span></button>
  <button class="btn primary" data-act="export" title="Exportar">${I('download')}<span class="hide-m">Exportar</span></button>`;
  $('#ratio').addEventListener('change', e => setRatio(e.target.value));
  const tools = [['photos', 'image', 'Fotos'], ['layouts', 'layout', 'Layouts'], ['text', 'text', 'Texto'], ['shapes', 'shape', 'Formas'], ['stickers', 'sticker', 'Stickers'], ['bg', 'bg', 'Fundo'], ['project', 'folder', 'Projeto']];
  $('#tools').innerHTML = tools.map(([t, i, l]) => `<button class="tool" data-tool="${t}">${I(i)}<span>${l}</span></button>`).join('');
}
function updHeader() {
  const n = $('#nSlides'); if (n) n.innerHTML = `${S.slides} <small>slide${S.slides > 1 ? 's' : ''}</small>`;
  const r = $('#ratio'); if (r) { r.value = S.ratio; [...r.options].forEach(o => o.textContent = isSmall() ? o.value : RATIO_LABEL[o.value]); }
}
const ctxLost = c => { try { return !!(c && c.getContext && c.getContext('2d').isContextLost && c.getContext('2d').isContextLost()); } catch (_) { return false; } };
let hiddenAt = 0;
// Refaz as imagens prontas para a tela a partir dos arquivos originais (o sistema pode apagá-las com pouca memória).
async function healMedia(force) {
  FCACHE.clear(); CUTC.clear(); VCACHE.clear(); THUMBS.clear(); BGTILE.key = ''; NOISE = null;
  for (const [id, c] of LASTFRAME) if (force || ctxLost(c)) LASTFRAME.delete(id);
  for (const r of IMGS.values()) {
    if (!force && !ctxLost(r.prev) && !ctxLost(r.thumb)) continue;
    try {
      if (r.video) {
        const v = makeVideo(r.url); await readyVideo(v); v.pause();
        const snap = max => { const k = Math.min(1, max / Math.max(r.w, r.h)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(r.w * k)); c.height = Math.max(1, Math.round(r.h * k)); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return c; };
        r.thumb = snap(140); r.img = r.prev = snap(640); r.tw = r.thumb.width; r.th = r.thumb.height; r.pw = r.prev.width; r.ph = r.prev.height;
        v.removeAttribute('src'); v.load();
      } else {
        if (!r.img.complete || !r.img.naturalWidth) r.img = await loadImg(r.url);
        const p = scaled(r.img, r.w, r.h, 2560), t = scaled(r.img, r.w, r.h, 140);
        Object.assign(r, { prev: p.c, pw: p.w, ph: p.h, thumb: t.c, tw: t.w, th: t.h });
      }
    } catch (err) { console.warn('heal', err); }
  }
  for (const e of S.els) if (isVidEl(e) && e.still && !LASTFRAME.has(e.id)) seekStill(e);
  lastOv = ''; dirty(); if (ui.sel) renderPanel();
}
async function init() {
  buildStatic();
  try { const saved = await IDB.get('project'); if (saved && saved.state) await restoreProject(saved); } catch (err) { console.warn(err); }
  try { VERS = (await IDB.get('versions')) || []; } catch (_) { VERS = []; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); // pede para o navegador não apagar os dados
  setTimeout(collectMedia, 4000);
  await loadLibrary();
  if (isMobile()) ui.panel = null;
  resetHistory(); updHeader(); renderPanel(); resize(); fitInitial();
  setSaved(S.els.length ? 'Salvo neste aparelho' : '');
  new ResizeObserver(() => { const had = CW; resize(); if (!had) fitInitial(); }).observe($('#stage'));
  matchMedia('(max-width: 820px)').addEventListener('change', () => { applyLayout(); updHeader(); renderPanel(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); clearTimeout(saveT); saveNow(); pauseAll(); releasePlayers(0); }
    else healMedia(Date.now() - hiddenAt > 60000 && !('isContextLost' in CanvasRenderingContext2D.prototype));
  });
  window.addEventListener('pagehide', () => { clearTimeout(saveT); saveNow(); });
  document.addEventListener('freeze', () => { clearTimeout(saveT); saveNow(); });
  cv.addEventListener('contextrestored', () => dirty());
}
init();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW', err)));
}
</script>
